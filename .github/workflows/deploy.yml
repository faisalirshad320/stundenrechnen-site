name: Deploy to Cloudways

# Auto-deploys the site to Cloudways on every push to main.
# Requires a GitHub repo secret (Settings -> Secrets and variables -> Actions):
#   CLOUDWAYS_API_KEY - a Cloudways Access Token (unified.cloudways.com -> API -> Create Access Token).
#                       The legacy account API key also works until Cloudways retires it (Oct 2026).
#   CLOUDWAYS_EMAIL   - optional; only needed with the legacy API key (OAuth exchange).
# Server/app IDs are not secret and are set below.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CW_EMAIL: ${{ secrets.CLOUDWAYS_EMAIL }}
      CW_API_KEY: ${{ secrets.CLOUDWAYS_API_KEY }}
      CW_SERVER_ID: "1638726"
      CW_APP_ID: "6719609"
      CW_BRANCH: "main"
    steps:
      - name: Resolve Cloudways bearer token
        id: token
        run: |
          set -e
          if [ -z "$CW_API_KEY" ]; then
            echo "::error::CLOUDWAYS_API_KEY secret is not set."
            exit 1
          fi
          BEARER=""
          if [ -n "$CW_EMAIL" ]; then
            RESP=$(curl -s -X POST https://api.cloudways.com/api/v1/oauth/access_token -d "email=$CW_EMAIL" -d "api_key=$CW_API_KEY" || true)
            BEARER=$(printf '%s' "$RESP" | grep -o '"access_token"[^,}]*' | head -1 | sed 's/.*"access_token"[^"]*"//; s/"$//')
          fi
          if [ -z "$BEARER" ]; then
            echo "Using the secret directly as the bearer token (Cloudways Access Token)."
            BEARER="$CW_API_KEY"
          fi
          echo "::add-mask::$BEARER"
          echo "token=$BEARER" >> "$GITHUB_OUTPUT"

      - name: Trigger Git pull (deploy) on Cloudways
        run: |
          # Cloudways runs one operation per server at a time; retry while another is in progress.
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /tmp/pull.json -w '%{http_code}' -X POST https://api.cloudways.com/api/v1/git/pull -H "Authorization: Bearer ${{ steps.token.outputs.token }}" -H "Accept: application/json" -d "server_id=$CW_SERVER_ID" -d "app_id=$CW_APP_ID" -d "branch_name=$CW_BRANCH")
            echo "Attempt $i – Git pull HTTP $CODE: $(cat /tmp/pull.json)"
            if [ "$CODE" = "200" ] && grep -q '"status":true' /tmp/pull.json; then exit 0; fi
            if [ "$CODE" = "422" ] && grep -qi 'in progress' /tmp/pull.json; then sleep 20; continue; fi
            echo "::error::Cloudways git pull failed"; exit 1
          done
          echo "::error::Cloudways server stayed busy; git pull not started"; exit 1

      - name: Purge application cache (Varnish)
        continue-on-error: true
        run: |
          sleep 25
          for i in $(seq 1 6); do
            CODE=$(curl -s -o /tmp/purge.json -w '%{http_code}' -X POST https://api.cloudways.com/api/v1/app/manage/varnish -H "Authorization: Bearer ${{ steps.token.outputs.token }}" -d "server_id=$CW_SERVER_ID" -d "app_id=$CW_APP_ID" -d "action=purge")
            echo "Attempt $i – Varnish purge HTTP $CODE: $(cat /tmp/purge.json)"
            if [ "$CODE" = "422" ]; then sleep 20; continue; fi
            break
          done
